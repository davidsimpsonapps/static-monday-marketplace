name: Crawl Developer Docs

on:
  schedule:
    - cron: "30 3 * * *" # Runs daily at 3:30 AM UTC
  workflow_dispatch: # Allows manual runs

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Crawl developer.monday.com
        run: node scripts/crawl-developer-docs.js

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A developer-docs/
          if git diff --cached --quiet; then
            echo "No changes in developer docs"
            exit 0
          fi
          git commit -m "Auto-update developer docs - $(date +'%Y-%m-%d %H:%M')" \
            -m "$(git diff --cached --stat | tail -1)"
          # Other scheduled workflows push to the same branch
          git pull --rebase
          git push
